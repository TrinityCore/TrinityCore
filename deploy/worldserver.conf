###################################################################################################
# AI WORLD SETTINGS
#
#    AIWorld.Enable
#        Description: Enable the AIWorld subsystem (read-only agent snapshotting, and later,
#                     inference integration). When disabled, no AIWorld code runs at all and
#                     behavior is identical to vanilla TrinityCore.
#        Default:     0 - (Disabled)
#                     1 - (Enabled)

AIWorld.Enable = 1

# Read-only AI World Observer. Requires WORLD_VIEWER_TELEMETRY_TOKEN in the
# worldserver and world-viewer environments. Capture runs once per second;
# network I/O runs on the shared asynchronous io_context. No grid is loaded.
AIWorld.TelemetryEnabled = 1
AIWorld.TelemetryHost = world-viewer
AIWorld.TelemetryPort = 8000

#
#    AIWorld.EnableSpawnReconciliation
#        Description: Milestone 2.12F4B/2.12F4B2 - when enabled, runs a one-time, startup-only
#                     reconciliation between eligible persistent non-instance world.creature
#                     spawns and ai_agents (AIWorldMgr::RunSpawnReconciliation()): missing spawns
#                     get a new ObserveOnly AgentRecord (AgentId = SpawnId), orphaned/conflicting
#                     ai_agents rows are quarantined out of the runtime registry (never deleted
#                     from the DB). REQUIRES AIWorld.SpawnReconciliationZoneId to also be set to a
#                     positive zoneId (2.12F4B2, STATIC review) - an unscoped/global run is
#                     refused (logged, not run) rather than silently falling back to one: the
#                     2.12F4B engine already measured a real unscoped run against this server's
#                     full world.creature dataset (census=128849) and observed a world-thread
#                     performance regression before 2.12F4C's scale hardening exists, so
#                     forgetting to set AIWorld.SpawnReconciliationZoneId must never silently
#                     repeat that. An unscoped/global mode gets its own explicit override once
#                     2.12F4C/2.12F4D exist.
#        Default:     0 - (Disabled)
#                     1 - (Enabled, requires AIWorld.SpawnReconciliationZoneId > 0)

AIWorld.EnableSpawnReconciliation = 1

#
#    AIWorld.SpawnReconciliationZoneId
#        Description: Milestone 2.12F4B2 - the zoneId AIWorld.EnableSpawnReconciliation's own
#                     reconciliation run is scoped to (e.g. 12 for Elwynn Forest). Only the
#                     eligible census (AIWorldMgr::RunSpawnReconciliation()'s own `census`) is
#                     filtered to this zone - AgentPersistence::LoadAllBindings() and
#                     BuildAllKnownCreatureSpawnIds() stay unscoped, so an existing agent outside
#                     this zone is left untouched (counted as out-of-scope) rather than
#                     misclassified as orphaned. Reads creature.zoneId directly via a narrow
#                     WorldDatabase query (FetchCreatureSpawnIdsForZone()) - never computes zone/
#                     area at runtime (that would require a live Map* and terrain/vmap data from
#                     disk, a dependency this subsystem's census pipeline has never had).
#        Important:   creature.zoneId must be freshly recalculated for the CURRENT world.creature
#                     state before this is used - run TrinityCore's own
#                     Calculate.Creature.Zone.Area.Data = 1 once, restart, verify the target rows
#                     have a nonzero zoneId in the DB, then turn Calculate.Creature.Zone.Area.Data
#                     back off. A never-recalculated/new row commonly reads as zoneId = 0 and is
#                     excluded, but a STALE row (calculated once, then the spawn moved/was
#                     re-scoped without a fresh recalculation) may still carry an old, nonzero
#                     zoneId and be silently matched into the wrong zone - not a loud failure
#                     either way, so this precondition is on the operator, not detected here. 0
#                     (or unset) makes AIWorld.EnableSpawnReconciliation refuse to run at all -
#                     see its own Description for why.
#        Default:     0 - (No scope configured; combined with AIWorld.EnableSpawnReconciliation = 1
#                          this refuses to run)

AIWorld.SpawnReconciliationZoneId = 12

#
#    AIWorld.EnableZoneControlActivation
#        Description: Milestone 2.12F4B3 - when enabled, promotes every scoped-eligible
#                     ObserveOnly AgentRecord in AIWorld.ControlZoneId to AIWorldControlled
#                     (AIWorldMgr::RunZoneControlActivation()). Only agents that already have a
#                     real AgentRecord for a scoped-eligible spawn are promoted (2.12F4B2
#                     reconciliation must have already created them - this never mints new
#                     identity); recomputes its own scoped set the same way
