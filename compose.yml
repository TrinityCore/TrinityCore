# Base development stack (section 1.5). Services do not depend on manual
# start order — dependencies are expressed via depends_on + healthchecks.
# Combine with compose.dev.yml for the interactive build/dev shell:
#   docker compose -f compose.yml -f compose.dev.yml up -d

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      TC_DB_USER: ${TC_DB_USER:-trinity}
      TC_DB_PASSWORD: ${TC_DB_PASSWORD:-trinity}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published to the host — only authserver/worldserver need it, over
    # the internal Compose network. Publish 3306 yourself if you need an
    # external DB client against a dev box.

  authserver:
    build:
      context: .
      dockerfile: docker/trinitycore/Dockerfile.dev
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    working_dir: /build/bin
    command: ["/scripts/render-conf-and-run.sh", "/etc/trinitycore/authserver.conf", "./authserver"]
    environment:
      TC_DB_USER: ${TC_DB_USER:-trinity}
      TC_DB_PASSWORD: ${TC_DB_PASSWORD:-trinity}
    volumes:
      - build-data:/build
      - ./deploy/authserver.conf:/etc/trinitycore/authserver.conf:ro
      - ./docker/scripts:/scripts:ro
      - ./runtime/logs:/runtime/logs
    ports:
      - "${AUTHSERVER_PORT:-3724}:3724"

  worldserver:
    build:
      context: .
      dockerfile: docker/trinitycore/Dockerfile.dev
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    working_dir: /build/bin
    command: ["/scripts/render-conf-and-run.sh", "/etc/trinitycore/worldserver.conf", "./worldserver"]
    environment:
      TC_DB_USER: ${TC_DB_USER:-trinity}
      TC_DB_PASSWORD: ${TC_DB_PASSWORD:-trinity}
    volumes:
      - build-data:/build
      - ./deploy/worldserver.conf:/etc/trinitycore/worldserver.conf:ro
      - ./docker/scripts:/scripts:ro
      - ${WOW_DATA_DIR:-./runtime/data}:/runtime/data
      - ./runtime/logs:/runtime/logs
    ports:
      - "${WORLDSERVER_PORT:-8085}:8085"

  ai-server:
    build:
      context: docker/ai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Internal only: worldserver reaches it at http://ai-server:8000 over the
    # Compose network. Publish AI_SERVER_PORT yourself if you need to hit
    # /health from the host while developing.

  gpu-check:
    image: nvidia/cuda:12.4.1-base-ubuntu22.04
    profiles: ["gpu-check"]
    command: ["nvidia-smi"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  mysql-data:
    name: aitc_mysql-data
  build-data:
    name: aitc_build-data
