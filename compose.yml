# Base development stack (section 1.5). Services do not depend on manual
# start order — dependencies are expressed via depends_on + healthchecks.
# Combine with compose.dev.yml for the interactive build/dev shell:
#   docker compose -f compose.yml -f compose.dev.yml up -d

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      TC_DB_USER: ${TC_DB_USER:-trinity}
      TC_DB_PASSWORD: ${TC_DB_PASSWORD:-trinity}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published to the host — only authserver/worldserver need it, over
    # the internal Compose network. Publish 3306 yourself if you need an
    # external DB client against a dev box.

  authserver:
    build:
      context: .
      dockerfile: docker/trinitycore/Dockerfile.dev
      args:
        USER_UID: ${DEV_UID:-1000}
        USER_GID: ${DEV_GID:-1000}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    working_dir: /build/bin
    command: ["bash", "/scripts/render-conf-and-run.sh", "/etc/trinitycore/authserver.conf", "./authserver"]
    environment:
      TC_DB_USER: ${TC_DB_USER:-trinity}
      TC_DB_PASSWORD: ${TC_DB_PASSWORD:-trinity}
    volumes:
      - build-data:/build
      - ./deploy/authserver.conf:/etc/trinitycore/authserver.conf:ro
      - ./docker/scripts:/scripts:ro
      - ./sql:/workspace/sql:ro
      - ./runtime/logs:/runtime/logs
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - "exec 3<>/dev/tcp/127.0.0.1/3724"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    ports:
      - "${AUTHSERVER_PORT:-3724}:3724"

  worldserver:
    build:
      context: .
      dockerfile: docker/trinitycore/Dockerfile.dev
      args:
        USER_UID: ${DEV_UID:-1000}
        USER_GID: ${DEV_GID:-1000}
    stdin_open: true
    tty: true
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    working_dir: /build/bin
    command: ["bash", "/scripts/render-conf-and-run.sh", "/etc/trinitycore/worldserver.conf", "./worldserver"]
    environment:
      TC_DB_USER: ${TC_DB_USER:-trinity}
      TC_DB_PASSWORD: ${TC_DB_PASSWORD:-trinity}
    volumes:
      - build-data:/build
      - ./deploy/worldserver.conf:/etc/trinitycore/worldserver.conf:ro
      - ./docker/scripts:/scripts:ro
      - ./sql:/workspace/sql:ro
      - ${WOW_DATA_DIR:-./runtime/data}:/runtime/data
      - ./runtime/logs:/runtime/logs
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - "exec 3<>/dev/tcp/127.0.0.1/8085"
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s
    ports:
      - "${WORLDSERVER_PORT:-8085}:8085"

  ai-server:
    build:
      context: docker/ai
    restart: unless-stopped
    environment:
      # Milestone 2.13A2: /dynamic-task's local-model provider, default-off
      # (AI_TASK_MODEL_ENABLED=0). AI_TASK_MODEL_URL points at any
      # OpenAI-compatible /v1/chat/completions endpoint (Ollama,
      # llama.cpp's server, ...) - no model service is added to this
      # Compose file automatically, point it at one you run yourself.
      AI_TASK_MODEL_ENABLED: ${AI_TASK_MODEL_ENABLED:-0}
      AI_TASK_MODEL_URL: ${AI_TASK_MODEL_URL:-}
      AI_TASK_MODEL_NAME: ${AI_TASK_MODEL_NAME:-}
      # Raised from 5000 to 30000 for 2.13A3B development - a real local
      # model's /dynamic-task response can take much longer than 5s,
      # especially with reasoning enabled; matches AIWorld.RequestTimeoutMs.
      AI_TASK_MODEL_TIMEOUT_MS: ${AI_TASK_MODEL_TIMEOUT_MS:-30000}
      AI_TASK_MODEL_MAX_REQUEST_BYTES: ${AI_TASK_MODEL_MAX_REQUEST_BYTES:-32768}
      AI_TASK_MODEL_MAX_RESPONSE_BYTES: ${AI_TASK_MODEL_MAX_RESPONSE_BYTES:-16384}
      AI_TASK_MODEL_MAX_TOKENS: ${AI_TASK_MODEL_MAX_TOKENS:-512}
      # Optional bearer token for backends that require one (some
      # gateways/proxies in front of an otherwise-open local model do,
      # even when the model itself doesn't) - empty by default.
      AI_TASK_MODEL_API_KEY: ${AI_TASK_MODEL_API_KEY:-}
      # Optional tri-state thinking control for backends that support a
      # chat_template_kwargs.enable_thinking toggle (e.g. Qwen3-style
      # reasoning models served through llama.cpp) - "0"/"1" sends
      # enable_thinking false/true explicitly, empty sends nothing
      # backend-specific at all. Defaults to 0 (explicitly disabled) for
      # 2.13A3B development - the model this phase is validated against
      # is a reasoning model whose chain-of-thought must stay off for
      # SYSTEM_PROMPT/AI_TASK_MODEL_MAX_TOKENS to work reliably.
      # false/true. Useful to force a reasoning model's chain-of-thought
      # off so it spends its max_tokens budget on the actual JSON answer.
      AI_TASK_MODEL_ENABLE_THINKING: ${AI_TASK_MODEL_ENABLE_THINKING:-0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Internal only: worldserver reaches it at http://ai-server:8000 over the
    # Compose network. Publish AI_SERVER_PORT yourself if you need to hit
    # /health from the host while developing.

  account-web:
    build:
      context: docker/account-web
    restart: unless-stopped
    depends_on:
      worldserver:
        condition: service_healthy
    environment:
      # worldserver's SOAP console (deploy/worldserver.conf SOAP.*) is only
      # bound inside the Compose network (port 7878 is not published to the
      # host below), so this URL is only ever reachable from other
      # containers. TC_SOAP_USER must already be an existing account with
      # SEC_ADMINISTRATOR on this realm — TrinityCore's own SOAP handler
      # requires that (src/server/worldserver/TCSoap/TCSoap.cpp) for every
      # command, account-web included. See README_DEV.md "Account creation
      # web UI" for the one-time bootstrap of that account. Defaults to
      # empty (not required) so an unrelated deploy that hasn't set these
      # in .env yet still comes up — the form just fails at submit time
      # until they're set, same failure mode as a wrong password.
      TC_SOAP_URL: http://worldserver:7878
      TC_SOAP_USER: ${TC_SOAP_USER:-}
      TC_SOAP_PASSWORD: ${TC_SOAP_PASSWORD:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      # 127.0.0.1 only: a single unchecked checkbox on this form grants
      # SEC_ADMINISTRATOR, so this must never be reachable outside the host.
      - "127.0.0.1:${ACCOUNT_WEB_PORT:-8088}:8000"

  gpu-check:
    image: nvidia/cuda:12.4.1-base-ubuntu22.04
    profiles: ["gpu-check"]
    command: ["nvidia-smi"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  mysql-data:
    name: ${MYSQL_VOLUME_NAME:-aitc_mysql-data}
  build-data:
    name: ${BUILD_VOLUME_NAME:-aitc_build-data}
