# Development overlay: adds the interactive build container (tc-dev).
#   docker compose -f compose.yml -f compose.dev.yml up -d
#   docker compose -f compose.yml -f compose.dev.yml exec tc-dev bash
#
# `make build`/`make shell` use `docker compose run --rm tc-dev ...` instead
# of `exec`, so building never depends on tc-dev already being up via `start`.

services:
  tc-dev:
    build:
      context: .
      dockerfile: docker/trinitycore/Dockerfile.dev
      args:
        USER_UID: ${DEV_UID:-1000}
        USER_GID: ${DEV_GID:-1000}
    volumes:
      - .:/workspace
      - build-data:/build
      - ccache-data:/ccache
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]

volumes:
  ccache-data:
    name: aitc_ccache-data
