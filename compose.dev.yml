# Development overlay: adds the interactive build container (tc-dev).
#   docker compose -f compose.yml -f compose.dev.yml up -d
#   docker compose -f compose.yml -f compose.dev.yml exec tc-dev bash
#
# `make build`/`make shell` use `docker compose run --rm tc-dev ...` instead
# of `exec`, so building never depends on tc-dev already being up via `start`.

services:
  tc-dev:
    build:
      context: .
      dockerfile: docker/trinitycore/Dockerfile.dev
      args:
        USER_UID: ${DEV_UID:-1000}
        USER_GID: ${DEV_GID:-1000}
    environment:
      TC_DB_USER: ${TC_DB_USER:-trinity}
      TC_DB_PASSWORD: ${TC_DB_PASSWORD:-trinity}
      # No :- fallbacks — configure-realm.sh must fail loudly on an unset
      # value rather than silently defaulting to 127.0.0.1 (see .env.example).
      REALM_NAME: ${REALM_NAME}
      REALM_ADDRESS: ${REALM_ADDRESS}
      REALM_LOCAL_ADDRESS: ${REALM_LOCAL_ADDRESS}
      REALM_LOCAL_SUBNET_MASK: ${REALM_LOCAL_SUBNET_MASK}
      REALM_PORT: ${REALM_PORT}
    volumes:
      - .:/workspace
      - build-data:/build
      - ccache-data:/ccache
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]

volumes:
  ccache-data:
    name: ${CCACHE_VOLUME_NAME:-aitc_ccache-data}
