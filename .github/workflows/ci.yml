name: CI

on:
  push:
    branches: [ai-world]
  pull_request:
    branches: [ai-world]
  workflow_dispatch:

jobs:
  # PR gate: GitHub-hosted, ephemeral VM per run. ccache is restored from
  # actions/cache but the CMake/Ninja build dir itself is not persisted, so
  # this job always reconfigures/relinks from scratch.
  build-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    env:
      CC: /usr/bin/gcc-13
      CXX: /usr/bin/g++-13
    steps:
      - uses: actions/checkout@v5

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-start=$EPOCHSECONDS" >> "$GITHUB_OUTPUT"
          echo "build-output-dir=${{ github.workspace }}/bin" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -yq ccache libboost-dev libboost-filesystem-dev libboost-locale-dev libboost-program-options-dev libboost-regex-dev libboost-thread-dev libssl-dev libreadline-dev zlib1g-dev libbz2-dev

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ci-ubuntu-gcc13-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ci-ubuntu-gcc13-${{ github.ref_name }}-
            ci-ubuntu-gcc13-

      - name: Configure CMake
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: >
          cmake -GNinja -S ${{ github.workspace }} -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS_DEBUG="-DNDEBUG -g0" -DCMAKE_CXX_FLAGS_DEBUG="-DNDEBUG -g0"
          -DWITH_WARNINGS=1 -DUSE_COREPCH=0 -DUSE_SCRIPTPCH=0 -DTOOLS=0 -DSCRIPTS=dynamic -DSERVERS=1 -DNOJEM=0
          -DCMAKE_INSTALL_PREFIX=check_install -DBUILD_TESTING=1

      - name: Build
        env:
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_CPP2: 1
        run: |
          ccache -z
          cmake --build ${{ steps.strings.outputs.build-output-dir }}
          ccache -s
          ccache --evict-older-than $(($EPOCHSECONDS - ${{ steps.strings.outputs.build-start }}))s

      - name: Unit tests
        run: |
          cmake --build ${{ steps.strings.outputs.build-output-dir }} --target test

  # Push/manual gate: self-hosted ci-runner, using its own persistent
  # build-data/ccache-data volumes (aitc_ci_*, separate from the running
  # server's aitc_build-data/aitc_ccache-data — see compose.yml). First run
  # per volume is a full build; later runs are incremental.
  build-server:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, docker, wow, ci]
    env:
      BUILD_VOLUME_NAME: aitc_ci_build-data
      CCACHE_VOLUME_NAME: aitc_ci_ccache-data
    steps:
      - uses: actions/checkout@v5

      - name: Build and test TrinityCore
        run: |
          docker compose -f compose.yml -f compose.dev.yml run --rm tc-dev bash -lc '
            cmake -GNinja \
              -S /workspace \
              -B /build \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_C_FLAGS_DEBUG="-DNDEBUG -g0" \
              -DCMAKE_CXX_FLAGS_DEBUG="-DNDEBUG -g0" \
              -DWITH_WARNINGS=1 \
              -DUSE_COREPCH=0 \
              -DUSE_SCRIPTPCH=0 \
              -DTOOLS=0 \
              -DSCRIPTS=dynamic \
              -DSERVERS=1 \
              -DNOJEM=0 \
              -DCMAKE_INSTALL_PREFIX=/build/check_install \
              -DBUILD_TESTING=1 \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

            ccache -z

            cmake --build /build

            ccache -s

            cmake --build /build --target test

            cmake --install /build

            /build/check_install/bin/authserver --version
            /build/check_install/bin/worldserver --version
          '

  deploy:
    needs: build-server
    # Only a trusted push to ai-world may reach the self-hosted runner —
    # pull_request (including from forks, since this repo is public) always
    # stays on the GitHub-hosted build-pr job above.
    if: github.ref == 'refs/heads/ai-world' && github.event_name == 'push'
    runs-on: [self-hosted, linux, docker, wow, deploy]
    steps:
      - name: Trust deploy repository
        run: |
          git config --global --add safe.directory /home/voslik/WoWBehaviorAI

      - name: Sync deploy checkout
        run: |
          cd /home/voslik/WoWBehaviorAI
          git fetch origin ai-world
          git reset --hard origin/ai-world

      - name: Compile TrinityCore
        # docker compose build below only (re)builds the dev image (apt
        # packages) — it does NOT compile source. Actual compilation happens
        # here, the same way `make build` does it locally: a throwaway
        # tc-dev container with the fresh checkout mounted at /workspace,
        # installing authserver/worldserver into the persistent build-data
        # volume that the app containers run from.
        run: |
          cd /home/voslik/WoWBehaviorAI
          make build

      - name: Restart stack
        run: |
          cd /home/voslik/WoWBehaviorAI
          docker compose build
          docker compose up -d
          # up -d only recreates containers whose config changed — force a
          # restart so authserver/worldserver actually reload the binary
          # make build just installed into build-data.
          docker compose restart authserver worldserver
